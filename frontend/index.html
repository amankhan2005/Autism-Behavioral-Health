<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F5F5B" />

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6SHNJ99MZQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6SHNJ99MZQ');
    </script>
    <title>Behavioral Health &amp; ABA Services in Delaware</title>
    <meta
      name="description"
      content="Autism &amp; Behavioral Health provides compassionate behavioral health and ABA services in Delaware. Contact us now for tailored support."
    />
  </head>
  <body>
    <!--
      Real Google Translate widget — set up exactly like the standard/default
      widget (static markup, outside the React root), so Google owns this DOM
      entirely and initializes once. It is visually hidden via CSS but stays
      fully functional; the custom React selector (GoogleTranslate.jsx) only
      finds the resulting .goog-te-combo and drives it. Keeping this out of
      React guarantees the combo the selector drives is the same one Google
      translates with.
    -->
    <div id="google_translate_element" class="notranslate" translate="no" aria-hidden="true"></div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'en', autoDisplay: false },
          'google_translate_element'
        );
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
